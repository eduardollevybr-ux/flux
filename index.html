<style>
:root{
  color-scheme: dark;
  --bg:#000000; --surface:#000000; --surface2:#141414; --surface3:#1F1F1F;
  --line:rgba(237,237,238,.11); --line2:rgba(237,237,238,.18);
  --text:#EDEDEE; --muted:#9C9AA6; --zero:#45434E;
  --weekend:#0D0D0D; --today-bg:#FFFFFF; --today-fg:#000000; --today-line:#FFFFFF;
  --accent:#8A3FD9; --accent-soft:rgba(138,63,217,.18);
  --pos:#223A6B; --pos-fg:#B4CFFF; --zero-s:#56400F; --zero-fg:#FFD86A; --neg1:#53222A; --neg1-fg:#FFB8BD; --neg2:#7C2330; --neg2-fg:#FFDDE0; --on-color:#FFFFFF;
  --c-entrada:#2F66E0; --c-saida:#EF4B4F; --c-diario:#EC5DA8; --c-economia:#4DB6F7; --c-cartao:#7A22C8;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --overlay:rgba(5,4,8,.65);
  --logo-a:#FFFFFF; --logo-b:#FFFFFF;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --screen:#000000; /* fundo das telas cheias: preto no escuro, branco no claro */
  --font:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root.light{
  color-scheme: light;
  --screen:#FFFFFF;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F3F5; --surface3:#E9E9EC;
  --line:rgba(29,31,35,.09); --line2:rgba(29,31,35,.16);
  --text:#1D1F23; --muted:#686D76; --zero:#B8BCC4;
  --weekend:#F3F3F5; --today-bg:#1D1F23; --today-fg:#FFFFFF; --today-line:#1D1F23;
  --logo-a:#820AD1; --logo-b:#820AD1;
  --pos:#DCE7FA; --pos-fg:#2F5DA8; --zero-s:#FBE3A1; --zero-fg:#5C4700; --neg1:#F8DADB; --neg1-fg:#9B3336; --neg2:#F0B3B5; --neg2-fg:#7E1F22;
  --c-economia:#34A6EE; --c-entrada:#2458C9; --c-cartao:#6A14B8; --accent:#820AD1; --accent-soft:rgba(130,10,209,.10);
  --shadow:0 18px 50px rgba(29,31,35,.18);
  --overlay:rgba(29,31,35,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- layout ---------- */
.app{display:flex;height:100%}
.sidebar{width:196px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:0 12px;transition:width .2s ease;overflow:hidden}
.sidebar.collapsed{width:72px}
.logo{display:flex;align-items:center;gap:10px;height:56px;margin-bottom:12px;padding:0 20px;color:var(--accent);font-weight:700;font-size:18px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:14px 26px 6px;white-space:nowrap}
.collapsed .nav-label{visibility:hidden}
.nav-btn{position:relative;display:flex;align-items:center;gap:13px;height:44px;padding:0 24px;color:var(--muted);font-weight:500;white-space:nowrap;text-align:left;width:100%}
@media (hover:hover){.nav-btn:hover{color:var(--text);background:var(--surface2)}}
.nav-btn svg{flex:none;width:22px;height:22px}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.collapsed .nav-btn span.t,.collapsed .logo .t{opacity:0}
.logo{padding-left:19px}
.logo-svg{display:block;flex:none}
.logo-tile{display:inline-flex;flex:none}
.logo .t{letter-spacing:.06em;color:var(--logo-a)}
.drawer-head .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* tela do dia / do mês */
.drawer.screen{width:min(480px,100%);background:var(--screen)}
@media (max-width:700px){ #drawer-root .drawer{border-left:0} }
.ph{display:grid!important;grid-template-columns:48px 1fr auto;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:0}
.ph-mid{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.ph-right{display:flex;justify-content:flex-end;gap:4px;min-width:48px}
.ph-title{font-size:26px;font-weight:700;white-space:nowrap}
.ph-date{border-radius:12px;padding:2px 8px}
@media (hover:hover){.ph-date:hover{background:var(--surface2)}}
.icon-btn.flat{background:transparent}
@media (hover:hover){.icon-btn.flat:hover{background:var(--surface2)}}
.icon-btn.flat svg{width:22px;height:22px}
.pb{padding:0!important;gap:0!important}
.pbar{padding:4px 16px 14px;border-bottom:1px solid var(--line2)}
.pfilt{display:flex;align-items:center;gap:10px}
.pfilt>*{min-height:38px;display:flex;align-items:center}
.pf-l{color:var(--muted);font-weight:600;font-size:15px}
.pf-i{display:flex;align-items:center;gap:8px}
.pill-dd{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 16px;border:2px solid var(--line2);border-radius:999px;font-weight:600;font-size:15px}
.pill-dd>svg{width:16px;height:16px}
.pill-dd span:not(.ti){flex:1;text-align:left}
.pill-dd>svg{color:var(--muted);flex:none}
.lrows{display:flex;flex-direction:column}
.lrow{display:flex;flex-direction:column;gap:6px;padding:18px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
@media (hover:hover){.lrow:hover{background:var(--surface2)}}
.lrow.static{cursor:default}@media (hover:hover){.lrow.static:hover{background:none}}.lrow.static:active{transform:none}
.lrow-top{display:flex;align-items:center;gap:12px;min-width:0}
.lrow-top .ti{border-radius:99px}
.lrow-top b{flex:1;min-width:0;font-size:17px}
.lrow-val{font-size:17px;white-space:nowrap}
.lrow-sub{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding-left:28px;min-width:0}
.lrow-rep{white-space:nowrap;text-align:right}
.pb .detail-grid{padding:16px}
.pb .skel{margin:12px 16px}
.form-err{margin:0;padding:10px 14px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--c-saida) 14%,transparent);color:var(--c-saida);font-weight:600;font-size:13px}

.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:24px;width:min(480px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);animation:pop .18s ease}
.modal.wide{width:min(640px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.modal-head h2{margin:0;font-size:20px;font-weight:700;flex:1}
.modal-body{padding:4px 20px 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.modal-foot{padding:14px 20px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.drawer-ov{position:fixed;inset:0;background:var(--overlay);z-index:40;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(100%)}}
.drawer-head{display:flex;align-items:center;gap:8px;padding:0 16px;min-height:56px;border-bottom:1px solid var(--line)}
.drawer-head.ph{border-bottom:0}
.drawer-head .dt{flex:1;text-align:center;font-weight:700;font-size:15px}
.drawer-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.dots{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--muted);flex:none}
@media (hover:hover){.dots:hover{background:var(--surface);color:var(--text)}}
.skel{height:62px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 0;color:var(--muted)}
.empty .plus{width:64px;height:64px;border-radius:99px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--accent)}
@media (hover:hover){.empty .plus:hover{border-color:var(--accent)}}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}
.detail-grid dt{color:var(--muted);font-size:13px}
.detail-grid dd{margin:0;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.popover{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:6px;overflow:auto;animation:fade .12s ease}
.pop-item{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px;height:46px;border-radius:10px;font-weight:500;white-space:nowrap;text-align:left}
@media (hover:hover){.pop-item:hover{background:var(--surface2)}}
.pop-item.red{color:var(--c-saida)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* padrão das janelas do menu (o mesmo do editar perfil): grupos com cara de campo e seções com título */
.msec{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.msec>h3{margin:0;font-size:15px}
.mintro{margin:0;color:var(--muted);line-height:1.55}
.mgroup{border:1px solid var(--line2);border-radius:var(--r-md);background:var(--surface2);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;color:inherit}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:0}
.mrow b{display:block;font-weight:600}
.mrow .hint{display:block;margin-top:2px}
.mrow .val{font-weight:600}
.mrow>svg.chev{width:18px;height:18px;color:var(--muted);flex:none}
.mrow.empty-row{color:var(--muted)}
label.mrow{cursor:pointer}
.mrow input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
@media (hover:hover){button.mrow:hover,label.mrow:hover{background:var(--surface3)}}
@media (hover:none){button.mrow:active,label.mrow:active{background:var(--surface3)}}
/* menu */
.profile-card{display:flex;align-items:center;gap:16px}
.avatar{width:56px;height:56px;border-radius:99px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.menu-ico{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--muted)}
.menu-ico svg{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted)}
.full-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
:root{--m-pos:#223A6B;--m-pos-fg:#B4CFFF;--m-zero:#56400F;--m-zero-fg:#FFD86A;--m-neg:#53222A;--m-neg-fg:#FFB8BD}
:root.light{--m-pos:#DCE7FA;--m-pos-fg:#2F5DA8;--m-zero:#FBE3A1;--m-zero-fg:#5C4700;--m-neg:#F8DADB;--m-neg-fg:#9B3336}
.tl{display:flex;align-items:center;gap:10px}
.tr-row{display:flex;align-items:center;gap:6px}
/* barra de rolagem no tom do app */
*{--sb:color-mix(in srgb,var(--muted) 60%,var(--bg));scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;border:2px solid var(--bg)}
@media (hover:hover){::-webkit-scrollbar-thumb:hover{background:var(--muted)}}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
/* celular: sem zoom de toque duplo nem zoom ao focar campos */
html,body,*{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (pointer:coarse),(max-width:700px){ .input,input,select,textarea{font-size:16px!important} }
.bottom-nav{display:none}
@media (max-width:900px) and (min-width:701px){
  .topbar{grid-template-columns:1fr;justify-items:start}
  .top-right{justify-self:start}
}
/* ---------- celular: tudo na vertical ---------- */
@media (max-width:700px){
  body{overflow-x:hidden}
  .sidebar{display:none}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);grid-template-columns:minmax(56px,auto) 1fr minmax(56px,auto);padding:6px 16px;min-height:calc(56px + env(safe-area-inset-top,0px));gap:8px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .topbar h1{display:none}
  .top-right{justify-self:end}
  .period{justify-content:center;gap:14px}
  .period .icon-btn{background:none}
  .m-label{min-width:0;font-size:24px;font-weight:700}
  .bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;font-weight:600;font-size:13px;color:var(--text)}
  .bn svg{width:24px;height:24px}
  .bn.active{color:var(--accent)}
  .bn.active::before{content:"";position:absolute;top:-1px;left:0;right:0;height:3px;background:var(--accent)}
  .page{padding:0 0 24px}
  .page-inner{gap:20px}
  .section-title{padding:18px 16px 0;margin:0 0 10px;color:var(--muted);font-weight:600;font-size:15px}
  .page .list{border-radius:0;border-left:0;border-right:0;background:var(--screen)}
  .topbar{border-bottom:0}
  .calc-grid{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
  .card.calc{border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:1fr auto;grid-template-areas:"h big" "f st" "bar bar";gap:6px 12px;padding:18px 16px;align-items:center}
  .calc h3{grid-area:h;font-size:17px}
  .calc .formula{grid-area:f}
  .calc .big{grid-area:big;font-size:18px;font-weight:600;text-align:right}
  .calc .status{grid-area:st;justify-self:end;background:none!important;padding:0;font-size:13px;font-weight:500}
  .calc > .bar{grid-area:bar}
  .profile-card{margin:16px 16px 0;flex-wrap:wrap}
  .menu-page .list{margin:0 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
  .row{padding-left:16px;padding-right:16px}
  .menu-page .row{padding-left:20px;padding-right:20px}
  .page-inner>.hint{padding:0 16px}
}
.m-cal{position:relative;width:34px;height:37px;display:block;padding:0}
.mc-body{position:absolute;left:0;right:0;top:3px;bottom:0;border-radius:0;background:var(--cal-bg);overflow:hidden;display:grid;place-items:center;padding-top:9px}
.mc-body::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:var(--accent)}
.mc-body b{font-size:14px;font-weight:700;color:var(--text)}
.mc-ring{position:absolute;top:0;width:3.5px;height:8px;border-radius:0;background:var(--cal-ring)}
.mc-ring.l{left:8px}.mc-ring.r{right:8px}
:root{--cal-bg:#2A2831;--cal-ring:#FFFFFF}
:root.light{--cal-bg:#E2E4E9;--cal-ring:var(--text)}
.m-grid{width:34px;height:34px;margin-top:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1.5px;padding:0;background:var(--bg);border-radius:6px;overflow:hidden}
.m-grid i{border-radius:0;background:var(--m-zero)}
.m-grid i.h-zero{background:var(--m-zero)}
.m-grid i.h-pos{background:var(--h-pos)}
.m-grid i.h-neg1{background:var(--h-neg1)}
.m-grid i.h-neg2{background:var(--h-neg2)}
.m-headrow{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:64px 1fr 40%;align-items:center;gap:0;border-bottom:1px solid var(--line2);padding:6px 0}
.m-headrow.h2{grid-template-columns:64px 1fr}
.m-headrow>span{color:var(--muted);font-weight:600;font-size:15px}
.m-headrow>span:first-child{text-align:center}
.m-headrow>span:last-child{text-align:right;padding-right:14px}
.m-sel{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:2px solid var(--line2);border-radius:999px;font-weight:600;font-size:15px;margin-right:8px;justify-self:start}
.m-sel>svg{width:16px;height:16px;color:var(--muted)}
.m-day{display:grid;grid-template-columns:64px 1fr 40%;border-bottom:1px solid var(--line2)}
.m-day.h2{grid-template-columns:64px 1fr}
.m-dia{position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:10px;font-size:16px;font-weight:600;border-right:1px solid var(--line)}
.m-day.we .m-dia{background:var(--weekend)}
.m-day.today .m-dia{background:var(--today-bg);color:var(--today-fg)}
.m-day.today{border-bottom:2px solid var(--today-line)}
.m-vals{display:flex;flex-direction:column;min-width:0}
.m-cell{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px;width:100%}
.m-cell:last-child{border-bottom:0}
.m-cell.z{color:var(--zero)}
.m-cell.z .ti{filter:grayscale(1);opacity:.45}
.m-saldo{display:flex;justify-content:flex-end;align-items:flex-start;padding:10px 14px 9px;font-size:15px;font-weight:600;min-height:40px}
.m-pos{background:var(--m-pos);color:var(--m-pos-fg)}
.m-zero{background:var(--m-zero);color:var(--m-zero-fg)}
.m-neg{background:var(--m-neg);color:var(--m-neg-fg)}
:root{--h-pos:#223A6B;--h-pos-fg:#B4CFFF;--h-neg1:#53222A;--h-neg1-fg:#FFB8BD;--h-neg2:#7C2330;--h-neg2-fg:#FFDDE0;--hz-cur:#EDEDEE;--hz-cur-fg:#1D1F23}
:root.light{--h-pos:#DCE7FA;--h-pos-fg:#2F5DA8;--h-neg1:#F8DADB;--h-neg1-fg:#7E2A2D;--h-neg2:#F0B3B5;--h-neg2-fg:#6E1B1E;--hz-cur:#222222;--hz-cur-fg:#FFFFFF}
.hz{display:flex;flex-direction:column}
.hz-head,.hz-row{display:grid;grid-template-columns:repeat(3,minmax(0,.6fr) minmax(0,1fr))}
.hz-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line2)}
.hz-mh{grid-column:span 2;text-align:center;font-weight:700;font-size:16px;padding:8px 0;border-right:1px solid var(--line)}
.hz-mh:last-child{border-right:0}
.hz-mh.cur{background:var(--hz-cur);color:var(--hz-cur-fg)}
.hz-row{border-bottom:0}
.hz-d,.hz-v{height:40px;display:flex;align-items:center;font-size:16px}
.hz-d{justify-content:center;font-weight:500}
.hz-d.we{background:var(--weekend)}
.hz-d.today{background:var(--today-bg);color:var(--today-fg);font-weight:700}
.hz-v{justify-content:flex-end;padding-right:12px;font-weight:500}
.hz-v.h-zero{background:var(--m-zero);color:var(--m-zero-fg)}
.hz-v.h-pos{background:var(--h-pos);color:var(--h-pos-fg)}
.hz-v.h-neg1{background:var(--h-neg1);color:var(--h-neg1-fg)}
.hz-v.h-neg2{background:var(--h-neg2);color:var(--h-neg2-fg)}
@media (max-width:700px){
  .m-hz .topbar{grid-template-columns:1fr auto}
  .m-hz .topbar h1{display:block;font-size:22px}
  .m-hz .period{display:none}
  .m-hz .bottom-nav{display:none}
}
.fc{font-style:italic}
@media (max-width:700px){ .page:has(.m-list),.page:has(.hz),.page.page-flush{padding-bottom:0} }
.cell.fc .v,.m-cell.fc span{opacity:.75}
.cell.fc .v,.m-cell.fc>span{padding-right:.18em;margin-right:-.18em}
@keyframes hzL{from{transform:translateX(100%);opacity:.3}}
@keyframes hzR{from{transform:translateX(-100%);opacity:.3}}
.hz.slide-l{animation:hzL .36s cubic-bezier(.22,.8,.2,1)}
.hz.slide-r{animation:hzR .36s cubic-bezier(.22,.8,.2,1)}
.page:has(.hz){overflow-x:hidden}
.fab{position:fixed;right:16px;bottom:90px;z-index:30;width:58px;height:58px;border-radius:99px;background:var(--accent);color:#fff;display:none;place-items:center;box-shadow:0 10px 28px rgba(80,40,160,.35)}
.fab svg{width:26px;height:26px}
@media (max-width:700px){ .fab:not([hidden]){display:grid} }
.m-foot{position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line2);border-bottom:0;box-shadow:0 -6px 16px rgba(0,0,0,.06)}
.m-foot .m-saldo{align-items:center;padding-block:10px}
.m-foot .m-dia{align-items:center;padding-top:0}
.auth{position:fixed;inset:0;z-index:95;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:hidden;overscroll-behavior:none}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.auth-card h2{margin:4px 0 0;font-size:26px}
.auth-card p{margin:0}
.auth-links{display:flex;justify-content:space-between;gap:12px}
.auth-links button{color:var(--accent);font-weight:600;padding:6px 0}
.auth-msg{min-height:20px;color:var(--muted);font-size:13px}
/* pop-up de e-mail de confirmação enviado (fica acima da tela de login) */
.mail-ov{position:fixed;inset:0;z-index:120;background:var(--overlay);display:grid;place-items:center;padding:16px;animation:fade .25s ease}
.mail-ov.out{animation:fade .2s ease reverse forwards}
.mail-box{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);width:min(400px,100%);padding:28px 22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;animation:pop .55s var(--spring)}
.mail-ov.out .mail-box{animation:pop .2s ease reverse forwards}
.mail-ic{width:76px;height:76px;border-radius:24px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-bottom:4px;animation:mailIn .8s var(--spring) .1s both}
.mail-ic svg{width:38px;height:38px;animation:mailFloat 2.6s ease-in-out 1s infinite}
@keyframes mailIn{from{transform:scale(.4) rotate(-18deg);opacity:0}}
@keyframes mailFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mail-box h2{margin:0;font-size:22px}
.mail-box p{margin:0;color:var(--muted);line-height:1.55}
.mail-box .mail-to{display:block;margin:4px 0;color:var(--text);font-weight:700;overflow-wrap:anywhere}
.mail-box .mail-tip{font-size:13px}
.mail-box .btn{margin-top:8px}
.mail-box>*:not(.mail-ic){animation:rise .6s var(--ease-out) both}
.mail-box>h2{animation-delay:.12s}.mail-box>p{animation-delay:.18s}.mail-box>p.mail-tip{animation-delay:.24s}.mail-box>.btn{animation-delay:.3s}
.m-foot .m-dia{font-size:13px;color:var(--muted);font-weight:500}
.m-foot .m-cell{font-weight:700}
.m-foot .m-cell.z{font-weight:500}
/* ================= movimento ================= */
:root{--spring:cubic-bezier(.2,1.25,.3,1);--ease-out:cubic-bezier(.16,1,.3,1)}
.pager{overflow-x:clip;touch-action:pan-y}
.track{display:flex;align-items:flex-start;width:100%;transform:translate3d(-100%,0,0)}
.pager.dragging .track,.pager[data-anim] .track{will-change:transform}
.pane{flex:0 0 100%;min-width:0}
.pager.dragging .pane{pointer-events:none}
.pager.dragging .pane:not(.cur){opacity:1}
.pager:not(.dragging):not([data-anim]) .pane:not(.cur){visibility:hidden}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.rise{animation:rise .62s var(--ease-out) both;animation-delay:calc(var(--i,0) * 38ms)}
.mcard.rise{animation-name:riseX;animation-duration:.7s}
@keyframes hzEnter{from{opacity:0;transform:scale(.965)}}
@keyframes hzLeave{from{opacity:0;transform:scale(1.03)}}
.view.hz-enter{animation:hzEnter .42s var(--ease-out);transform-origin:50% 0}
.view.hz-leave{animation:hzLeave .42s var(--ease-out);transform-origin:50% 0}
@keyframes riseX{from{opacity:0;transform:translateX(40px) scale(.98)}}
@keyframes slideL{from{transform:translateX(38%);opacity:0}}
@keyframes slideR{from{transform:translateX(-38%);opacity:0}}
.slide-l{animation:slideL .5s var(--ease-out)!important}
.slide-r{animation:slideR .5s var(--ease-out)!important}
/* toques: tudo responde */
.btn,.icon-btn,.bn,.fab,.frow,.sitem,.lrow,.row,.pop-item,.nav-btn,.m-sel,.pill-dd,.scope,.m-grid,.m-cal,.ph-date,.cal2-grid button{transition:transform .22s var(--spring),background-color .2s,color .2s,box-shadow .2s,border-color .2s}
.btn:active,.icon-btn:active,.fab:active,.pop-item:active,.m-sel:active,.pill-dd:active,.scope:active,.m-grid:active,.m-cal:active,.cal2-grid button:active{transform:scale(.92)}
.frow:active,.sitem:active,.lrow:active,.row:active,.nav-btn:active{transform:scale(.98)}
.m-cell,.m-saldo,.m-dia,.hz-d,.hz-v{transition:transform .2s var(--spring),background-color .2s}
.m-cell:active,.m-saldo:active,.hz-v:active{transform:scale(.97)}
.cell,.c-saldo{transition:background-color .18s,filter .18s,box-shadow .18s}
@media (hover:hover){.cell:hover{box-shadow:inset 0 0 0 1px var(--line2)}}
@media (hover:hover){.btn.primary:hover,.btn[class*="btn-t-"]:hover{transform:translateY(-1px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent)}}
/* barra de baixo: indicador desliza */
.bottom-nav{position:relative}
.bn-ind{position:absolute;top:-1px;left:0;width:33.3333%;height:3px;background:var(--accent);border-radius:0 0 3px 3px;transition:transform .5s var(--spring)}
.bn.active::before{display:none!important}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22) translateY(-3px)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.bn.bump svg{animation:bump .55s var(--spring)}
/* barra lateral */
@keyframes barIn{from{transform:scaleY(0)}}
.nav-btn.active::before{animation:barIn .45s var(--spring);transform-origin:center}
.nav-btn svg{transition:transform .3s var(--spring)}
@media (hover:hover){.nav-btn:hover svg{transform:scale(1.12) rotate(-4deg)}}
/* botão flutuante */
@keyframes fabIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.fab:not(.ready){visibility:hidden}
.fab.ready:not([hidden]){animation:fabIn .6s var(--spring)}
.fab svg{transition:transform .35s var(--spring)}
.fab:active svg{transform:rotate(90deg)}
/* janelas e folhas com mola */
@keyframes pop{from{transform:translateY(26px) scale(.93);opacity:0}}
.modal{animation:pop .5s var(--spring)!important}

    setNet({ dirty: !!dirty });
  };

    if (!SB_USER || !SB || !isOnline() || NET.relogin) return false;

    let error = null;
    try { ({ error } = await SB.from(SB_TABLE).upsert(row)); } catch (e) { error = e; }
    saving = false;
    if (error) { console.warn(error); if (isOnline()) toast("não deu para salvar agora. tenta de novo em instantes", true); return false; }

  };

    let data = null, error = null;
    try { ({ data, error } = await SB.from(SB_TABLE).select("data,updated_at").eq("user_id", SB_USER.id).maybeSingle()); } catch (e) { error = e; }
    if (error) { console.warn(error); if (!S.loaded) toast("não deu para carregar seus dados. tenta de novo", true); return; }

    if (data) { applyData(data.data); lastSaved = data.updated_at; }
    else { const loc = lsGet("ae.data", null); applyData(loc); imported = !!(loc && ((loc.txs || []).length || (loc.prev || []).length)); }

      if (!same && cache && cache.uid !== session.user.id) { lsSet(CACHE_KEY, null); cache = null; }

      if (cache && !lsGet(CACHE_KEY, null)) cache = null; // saiu ou apagou a conta de propósito

  });
}

function initDb(db, userId) {
  S.mode = "db";
  const root = db.doc(`data/users/${userId}/profile`);
  const chk = db.doc(`data/users/${userId}/checkins`);
  const colls = { txs: "tx", tags: "tags", cards: "cards", prev: "prev" };
  const waiting = new Set([...Object.keys(colls), "profile", "checkins"]);
  const done = k => { waiting.delete(k); if (!waiting.size && !S.loaded) { S.loaded = true; } dataChanged(); };
  for (const [k, c] of Object.entries(colls)) {
    root.collection(c).onSnapshot(snap => { S[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })); done(k); }, e => { console.warn(e); done(k); });
  }
  root.onSnapshot(s => { S.profile = s.exists ? { ...s.data() } : null; done("profile"); }, e => { console.warn(e); done("profile"); });
  chk.onSnapshot(s => { S.checkins = s.exists ? { ...(s.data().dates || {}) } : {}; done("checkins"); }, e => { console.warn(e); done("checkins"); });
  backend = {
    put: (c, id, data) => queue(c + id, () => root.collection(c).doc(id).set(data)).catch(onErr),
    del: (c, id) => queue(c + id, () => root.collection(c).doc(id).delete()).catch(onErr),
    putProfile: data => queue("profile", () => root.set(data)).catch(onErr),
    putCheckins: dates => queue("checkins", () => chk.set({ dates })).catch(onErr),
  };
}

/* percorre as ocorrências de um lançamento dentro de [from, to] */
function expand(tx, from, to, cb) {
  if (!tx.date) return;

  const inst = rep === "installment";

  let i0 = 0;
  if (count === Infinity || count > 400) { // pula direto para perto de "from"
    const f = parse(from);
    if (rep === "daily") i0 = Math.max(0, Math.round((f - start) / 864e5) - 1);
    else if (rep === "weekly") i0 = Math.max(0, Math.floor((f - start) / (864e5 * 7)) - 1);
    else if (rep === "monthly") i0 = Math.max(0, miOf(f) - miOf(start) - 1);
    else if (rep === "yearly") i0 = Math.max(0, f.getFullYear() - start.getFullYear() - 1);
  }
  for (let i = i0; i < count; i++) {
    let d;

    else if (rep === "monthly" && tx.mday && tx.mday !== "same") { const t = new Date(start.getFullYear(), start.getMonth() + i, 1); d = monthDate(tx.mday, t.getFullYear(), t.getMonth(), tx.aday || od, tx.nth); }

    if (s < from || (skip && skip.has(s))) continue;

function occs(from, to) {
  const out = [];

  return out;
}

let CALC = null;
function calc() {
  if (CALC) return CALC;
  const tm = tagMap();
  const gEnd = miLast(MAX_MI);
  let gStart = miFirst(MIN_MI);
  for (const tx of S.txs) if (tx.date && tx.date < gStart) gStart = tx.date;
  const day = {};
  for (const tx of S.txs) {
    const ig = ignores(tx, "saldos", tm);
    expand(tx, gStart, gEnd, (d, v) => {
      const o = day[d] || (day[d] = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0, bal: 0 });
      o[tx.type] = r2(o[tx.type] + v);
      if (!ig) o.bal = r2(o.bal + (tx.type === "entrada" ? v : -v));
    });
  }
  const saldo = {};
  const pd = perDayPrev();
  let run = 0;
  for (let d = parse(gStart), end = parse(gEnd); d <= end; d = addDays(d, 1)) {
    const k = ymd(d);
    if (day[k]) run = r2(run + day[k].bal);
    if (pd && k > TODAY) run = r2(run - pd); // previsão de diário: só de amanhã em diante
    saldo[k] = run;

}

const saldoCls = v => Math.abs(v) < 0.005 ? "s-zero" : v > 0 ? "s-pos" : (v > -NEG_SMALL ? "s-neg1" : "s-neg2");

function prevTotal() { return r2(S.prev.reduce((a, p) => a + (+p.value || 0), 0)); }
/* previsão por dia: total do mês dividido pelos dias escolhidos (28 a 31, padrão 30) */
const prevDiv = () => { const n = +prof().prevDias; return n >= 28 && n <= 31 ? n : 30; };

function cellVal(o, t, ds) { const real = o ? o[t] : 0; const fc = t === "diario" && ds > TODAY ? perDayPrev() : 0; return { v: r2(real + fc), real, fc }; }

function monthStats(mi) {
  const tm = tagMap();
  const list = occs(miFirst(mi), miLast(mi));
  const sum = (part) => { const o = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0 }; for (const x of list) if (!part || !ignores(x.tx, part, tm)) o[x.tx.type] = r2(o[x.tx.type] + x.value); return o; };

  return {
    list, all, days, P, perDay: pdv, passed,
    performance: r2(pf.entrada - pf.saida - pf.diario - pf.economia - pf.cartao - P),
    econPct: ec.entrada > 0 ? (ec.economia / ec.entrada) * 100 : 0, econVal: ec.economia, econBase: ec.entrada,
    custo: r2(cv.saida + cv.diario + cv.cartao + P), custoBase: cv.entrada,
    diarioMedio: r2(dm.diario / (passed || days)), diarioTot: dm.diario, diarioDias: passed || days,

}

  el.style.maxHeight = (bottom - top) + "px";

function occInfo(tx, date) { let r = null; expand(tx, date, date, (d, v, n, t) => { r = { date: d, value: v, n, total: t }; }); return r; }

function chooseScope({ title, text, date, hasNext, danger }) {
  return new Promise(res => {

      title, body: `<p class="dialog-text">${text}</p>
      <div class="scope-list">
        <button class="scope" data-s="one"><b>só este</b><span>só o de ${dBR(date)}</span></button>
        <button class="scope" data-s="from"><b>este e os próximos</b><span>de ${dBR(date)} em diante</span></button>
        <button class="scope" data-s="next" ${hasNext ? "" : "disabled"}><b>só os próximos</b><span>${hasNext ? `depois de ${dBR(date)}, sem mexer neste` : "não tem próximos"}</span></button>
        <button class="scope ${danger ? "danger" : ""}" data-s="all"><b>todos</b><span>todas as repetições, inclusive as que já passaram</span></button>
      </div>`, onClose: () => { if (!done) res(null); }
    });
    m.el.addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b || b.disabled) return; done = true; m.close(); res(b.dataset.s); });
  });

async function deleteOcc(tx, date) {
  if (!tx) return;
  if ((tx.rep || "none") === "none") {
    if (!(await confirmBox({ title: "apagar movimentação?", text: `"${esc(tx.desc)}" vai sumir do app.`, ok: "apagar" }))) return;
    await delTx(tx.id); afterDelete(); return;
  }
  const nd = nextOccDate(tx, date);
  const s = await chooseScope({ title: "apagar movimentação", text: `"${esc(tx.desc)}" se repete. o que você quer apagar?`, date, hasNext: !!nd, danger: true });
  if (!s) return;
  const first = occInfo(tx, date)?.n === 1;
  if (s === "all" || (s === "from" && first)) await delTx(tx.id);
  else if (s === "one") await saveTx(tx.id, { ...stripId(tx), skip: [...(tx.skip || []), date] });
  else if (s === "from") await saveTx(tx.id, { ...stripId(tx), endBefore: date });
  else if (s === "next") await saveTx(tx.id, { ...stripId(tx), endBefore: nd });
  afterDelete();
}
function afterDelete() { if (PANEL.open) { if (PANEL.fromSearch) return closePanel(); PANEL.detail = null; renderPanel(); } }

function parseMoney(str) { const dg = String(str).replace(/\D/g, ""); return dg ? parseInt(dg, 10) / 100 : 0; }

  closePopover();
  const edit = !!tx;
  const recurring = edit && (tx.rep || "none") !== "none";
  const occD = recurring ? (occ || tx.date) : (edit ? tx.date : null);
  const oi = recurring ? occInfo(tx, occD) : null;
  const perInst = edit && tx.rep === "installment";
  const f = edit ? {
    value: perInst ? (oi ? oi.value : r2(tx.value / (tx.installments || 1))) : tx.value, type: tx.type, desc: tx.desc, date: occD, rep: tx.rep || "none", until: tx.until || "forever",
    count: tx.count || 2, installments: tx.installments || 2, tags: [...(tx.tags || [])], cardId: tx.cardId || "",
    mday: tx.rep === "monthly" && tx.mday ? tx.mday : "same", nth: tx.nth || 5, aday: tx.aday || (tx.date ? +tx.date.slice(8) : 1),
  } : { value: 0, type, desc: "", date, rep: "none", until: "forever", count: 2, installments: 2, tags: [], cardId: "", mday: "same", nth: 5, aday: +date.slice(8) };
  const isRule = () => f.rep === "monthly" && f.mday !== "same";
  /* data real conforme a regra do dia (usa o mês da data escolhida) */
  const effDate = ds => { if (f.rep !== "monthly" || f.mday === "same") return ds; const d = parse(ds); return ymd(monthDate(f.mday, d.getFullYear(), d.getMonth(), f.aday, f.nth)); };
  const MDAY_LABEL = () => f.mday === "nth" ? `${f.nth}º dia útil` : f.mday === "biz" ? `dia ${f.aday} ou próximo útil` : "mesmo dia";
  const m = openModal({ title: edit ? "editar movimentação" : "adicionar movimentação", body: "", cls: "form-modal", foot: `<button class="btn block" id="f-submit"></button><button class="btn-link" id="f-cancel">cancelar</button>` });

  const REP_ICO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="15" height="15" rx="2.5"/><path d="M3 9h15M7.5 2.5v4M13.5 2.5v4"/><path d="M21 15a4 4 0 1 1-1.2-2.8M21 11.5V14h-2.5"/></svg>';
  const PEN = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const CAL = I.cal.replace("<svg", '<svg width="22" height="22"');
  const CHEV = '<svg class="fr-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
  function draw() {
    const inst = f.rep === "installment", repeats = ["monthly", "weekly", "daily", "yearly"].includes(f.rep);
    const pi = perInst && inst;
    m.setBody(`
      <div class="f-money"><span class="flabel sr-only" id="lbl-val">${pi ? "valor da parcela" : inst ? "valor total" : "valor"}</span>
        <span class="f-cur">R$</span><input id="f-val" autocomplete="off" inputmode="numeric" aria-labelledby="lbl-val" class="num" placeholder="0,00" value="${f.value ? fmt(f.value) : ""}"></div>
      ${inst ? `<p class="f-hint num">${pi ? `valor de cada parcela` : `${f.installments}x de ${brl(f.value / f.installments)}`}</p>` : ""}
      <div class="frows">

        ${inst ? `<div class="frow"><span class="fr-ico">${I.card.replace("<svg", '<svg width="22" height="22"')}</span><span class="fr-main">parcelas</span><span class="stepper"><button class="icon-btn" data-inst="-1" aria-label="menos uma parcela">−</button><b class="num" aria-live="polite">${f.installments}</b><button class="icon-btn" data-inst="1" aria-label="mais uma parcela">+</button></span></div>` : ""}
      </div>`);
    const b = $("#f-submit", el);
    b.className = `btn block btn-t-${f.type}`;
    b.textContent = edit ? "salvar alterações" : TYPES[f.type].btn;
  }
  draw();
  el.addEventListener("input", e => {
    if (e.target.id === "f-val") {
      f.value = parseMoney(e.target.value);
      e.target.value = f.value ? fmt(f.value) : "";
      const h = $(".f-hint", el); if (h && !(perInst && f.rep === "installment")) h.textContent = `${f.installments}x de ${brl(f.value / f.installments)}`;
    }
    if (e.target.id === "f-desc") f.desc = e.target.value;
  });
  const listSheet = (title, items, cur, pick) => {
    const s = openSheet({ title, body: `<div class="slist">${items.map(([k, main, sub, ico]) => `<button class="sitem ${k === cur ? "on" : ""}" data-k="${k}">${ico ? `<span class="si-ico">${ico}</span>` : ""}<span class="si-txt"><b>${main}</b>${sub ? `<span>${sub}</span>` : ""}</span></button>`).join("")}</div>` });
    s.el.addEventListener("click", ev => { const b = ev.target.closest("[data-k]"); if (b) { s.close(); pick(b.dataset.k); } });
  };
  el.addEventListener("click", e => {
    const t = e.target;
    const ins = t.closest("[data-inst]"); if (ins) { f.installments = Math.max(2, Math.min(120, f.installments + +ins.dataset.inst)); return draw(); }
    if (t.closest("#f-type")) listSheet("tipo", TYPE_ORDER.map(k => [k, TYPES[k].label, "", ti(k, true)]), f.type, k => { f.type = k; draw(); });
    if (t.closest("#f-card")) cardSheet(f.cardId, id => { f.cardId = id; draw(); });
    if (t.closest("#f-date")) datePicker(null, effDate(f.date), v => { f.date = v; f.aday = +v.slice(8); draw(); });
    if (t.closest("#f-mday")) {
      const day = f.mday === "biz" ? f.aday : +f.date.slice(8);
      const s = openSheet({ title: "repete no", body: `<div class="slist">
          <button class="sitem ${f.mday === "same" ? "on" : ""}" data-md="same"><span class="si-txt"><b>mesmo dia</b><span>sempre no dia ${day}, mesmo se cair em fim de semana ou feriado</span></span></button>
          <button class="sitem ${f.mday === "biz" ? "on" : ""}" data-md="biz"><span class="si-txt"><b>dia ${day} ou próximo dia útil</b><span>se o dia ${day} cair em fim de semana ou feriado, passa para o próximo dia útil</span></span></button>
          <div class="sitem ${f.mday === "nth" ? "on" : ""}" data-md="nth" role="button" tabindex="0"><span class="si-txt"><b>dia útil do mês</b><span>ex.: todo 5º dia útil</span></span>
            <span class="stepper"><button class="icon-btn" data-nc="-1" aria-label="um dia útil a menos">−</button><b class="num" id="md-n">${f.nth}º</b><button class="icon-btn" data-nc="1" aria-label="um dia útil a mais">+</button></span></div>
        </div><p class="hint sheet-hint">dia útil: segunda a sexta, sem contar os feriados nacionais.</p><button class="btn block primary" data-mdsave>confirmar</button>` });
      let mode = f.mday, n = f.nth;
      s.el.addEventListener("click", ev => {
        const c = ev.target.closest("[data-nc]");
        if (c) { n = Math.max(1, Math.min(22, n + +c.dataset.nc)); $("#md-n", s.el).textContent = n + "º"; mode = "nth"; }
        const u = ev.target.closest("[data-md]"); if (u && !c) mode = u.dataset.md;
        $$("[data-md]", s.el).forEach(x => x.classList.toggle("on", x.dataset.md === mode));
        if (ev.target.closest("[data-mdsave]")) { if (mode === "biz" && f.mday !== "biz") f.aday = day; f.mday = mode; f.nth = n; s.close(); draw(); }
      });
    }
    if (t.closest("#f-rep")) listSheet("repetição", Object.keys(REP_LABEL).map(k => [k, REP_LABEL[k], REP_DESC[k]]), f.rep, k => { f.rep = k; draw(); });
    if (t.closest("#f-until")) {
      const s = openSheet({ title: "até quando", body: `<div class="slist">
          <button class="sitem ${f.until === "forever" ? "on" : ""}" data-u="forever"><span class="si-txt"><b>sem data para acabar</b><span>repete até você apagar ou mudar</span></span></button>
          <div class="sitem ${f.until === "count" ? "on" : ""}" data-u="count" role="button" tabindex="0"><span class="si-txt"><b>número de repetições</b><span>escolhe quantas vezes</span></span>
            <span class="stepper"><button class="icon-btn" data-c="-1" aria-label="menos uma" ${f.count <= 2 ? "disabled" : ""}>−</button><b class="num" id="u-n">${f.count}</b><button class="icon-btn" data-c="1" aria-label="mais uma">+</button></span></div>
        </div><button class="btn block primary" data-usave>confirmar</button>` });
      let mode = f.until, cnt = f.count;
      s.el.addEventListener("click", ev => {
        const c = ev.target.closest("[data-c]");
        if (c) { cnt = Math.max(2, Math.min(999, cnt + +c.dataset.c)); $("#u-n", s.el).textContent = cnt; $('[data-c="-1"]', s.el).disabled = cnt <= 2; mode = "count"; }
        const u = ev.target.closest("[data-u]"); if (u && !c) mode = u.dataset.u;
        $$("[data-u]", s.el).forEach(x => x.classList.toggle("on", x.dataset.u === mode));
        if (ev.target.closest("[data-usave]")) { f.until = mode; f.count = cnt; s.close(); draw(); }
      });
    }
    if (t.closest("#f-submit")) submit();
    if (t.closest("#f-cancel")) m.close();
  });
  async function submit() {
    if (!(f.value > 0)) { toast("coloca um valor maior que zero", true); $("#f-val", el)?.focus(); return; }
    if (f.type === "cartao" && !(f.cardId && cardName(f.cardId))) { toast("escolhe o cartão desse gasto", true); cardSheet(f.cardId, id => { f.cardId = id; draw(); }); return; }
    if (f.date < miFirst(MIN_MI) || f.date > miLast(MAX_MI)) { toast("a data precisa estar dentro de 5 anos para trás ou para frente", true); return; }
    const desc = f.desc.trim() || TYPES[f.type].label;
    const rule = isRule();
    const base = { type: f.type, desc, rep: f.rep, until: f.until, count: f.count, installments: f.installments, tags: [], cardId: f.type === "cartao" ? f.cardId : "", skip: [], endBefore: null, mday: rule ? f.mday : "same", nth: rule && f.mday === "nth" ? f.nth : null, aday: rule && f.mday === "biz" ? f.aday : null };
    const fDate = effDate(f.date);
    const stored = (v, rep, n) => rep === "installment" && perInst ? r2(v * n) : r2(v);
    if (!recurring) {
      const data = { ...base, value: r2(f.value), date: fDate, createdAt: edit ? tx.createdAt || Date.now() : Date.now() };
      m.close(); await saveTx(edit ? tx.id : uid("t"), data); if (PANEL.open) renderPanel(); return;
    }
    const nd = nextOccDate(tx, occD);
    const s = await chooseScope({ title: "salvar alterações", text: `"${esc(tx.desc)}" se repete. para quais repetições vale essa mudança?`, date: occD, hasNext: !!nd });
    if (!s) return;
    m.close();
    const delta = dayDiff(occD, fDate), n = oi ? oi.n : 1, now = Date.now();
    const ruleKey = o => o.rep === "monthly" ? `${o.mday || "same"}|${o.nth || ""}|${o.aday || ""}` : "";
    const old = stripId(tx);
    if (s === "one") {
      await saveTx(tx.id, { ...old, skip: [...(tx.skip || []), occD] });
      await saveTx(uid("t"), { ...base, rep: "none", mday: "same", nth: null, aday: null, value: r2(f.value), date: fDate, createdAt: now });
    } else if (s === "all" || (s === "from" && n === 1)) {
      const start = rule ? effDate(delta ? shiftDate(tx.date, delta) : tx.date) : shiftDate(tx.date, delta);
      const keep = tx.rep === f.rep && start === tx.date && ruleKey(tx) === ruleKey(base);
      await saveTx(tx.id, { ...base, value: stored(f.value, f.rep, f.installments), date: start, createdAt: tx.createdAt || now, skip: keep ? tx.skip || [] : [], endBefore: keep ? tx.endBefore || null : null });
    } else {
      const cut = s === "from" ? occD : nd;
      const done = s === "from" ? n - 1 : n;
      const cnt = f.rep === tx.rep && f.until === "count" && f.count === (tx.count || 2) ? Math.max(1, f.count - done) : f.count;
      const ins = f.rep === "installment" && tx.rep === "installment" && f.installments === (tx.installments || 2) ? Math.max(1, f.installments - done) : f.installments;
      await saveTx(tx.id, { ...old, endBefore: cut });
      await saveTx(uid("t"), { ...base, count: cnt, installments: ins, value: stored(f.value, f.rep, ins), date: rule ? effDate(shiftDate(cut, delta)) : shiftDate(cut, delta), createdAt: now, skip: (tx.skip || []).filter(x => x > cut) });
    }
    if (PANEL.open) { PANEL.detail = null; renderPanel(); }
  }
}

function datePicker(anchor, value, onPick) {
  closePopover();
  let sel = value, cur = parse(value), vy = cur.getFullYear(), vm = cur.getMonth();
  const html = () => {
    const first = new Date(vy, vm, 1).getDay(), n = dim(vy, vm), mi = vy * 12 + vm;
    let g = WD.map(w => `<span class="wd">${w}</span>`).join("");
    const cell = (y, m0, d, out) => { const s = `${y}-${pad(m0 + 1)}-${pad(d)}`; return `<button data-day="${s}" class="num ${out ? "out" : ""} ${s === sel ? "sel" : ""} ${s === TODAY ? "tdy" : ""}" aria-label="${dLong(s)}" ${s === sel ? 'aria-pressed="true"' : ""}>${d}</button>`; };
    const pmi = mi - 1, pn = dim(miY(pmi), miM(pmi));
    for (let i = first - 1; i >= 0; i--) g += cell(miY(pmi), miM(pmi), pn - i, true);
    for (let d = 1; d <= n; d++) g += cell(vy, vm, d, false);
    const tail = (7 - ((first + n) % 7)) % 7, nmi = mi + 1;
    for (let d = 1; d <= tail; d++) g += cell(miY(nmi), miM(nmi), d, true);
    return `<div class="cal2"><div class="cal2-head"><b>${MONTHS[vm]} de ${vy}</b>
      <button class="icon-btn flat" data-today aria-label="ir para hoje">${I.cal}</button>
      <button class="icon-btn flat" data-cm="-1" aria-label="mês anterior" ${mi <= MIN_MI ? "disabled" : ""}>${I.left}</button>
      <button class="icon-btn flat" data-cm="1" aria-label="próximo mês" ${mi >= MAX_MI ? "disabled" : ""}>${I.right}</button></div>
      <div class="cal2-grid">${g}</div></div><button class="btn block primary" data-dsave>confirmar</button>`;
  };
  const s = openSheet({ title: "data", body: html() });
  const body = $(".modal-body", s.el);
  s.el.addEventListener("click", e => {
    const cm = e.target.closest("[data-cm]");
    if (cm) { const mi = vy * 12 + vm + +cm.dataset.cm; vy = miY(mi); vm = miM(mi); body.innerHTML = html(); const g = $(".cal2-grid", body); if (g) animateSlideEl(g, +cm.dataset.cm); return; }
    if (e.target.closest("[data-today]")) { sel = TODAY; vy = NOW.getFullYear(); vm = NOW.getMonth(); body.innerHTML = html(); return; }
    const d = e.target.closest("[data-day]");
    if (d) { sel = d.dataset.day; const p = parse(sel); vy = p.getFullYear(); vm = p.getMonth(); body.innerHTML = html(); return; }
    if (e.target.closest("[data-dsave]")) { s.close(); onPick(sel); }
  });
}
// escolher o cartão do lançamento (ou cadastrar um na hora, só com o nome)
function cardSheet(cur, onPick) {

    <div class="sheet-new"><div class="field"><label for="nc-name">${S.cards.length ? "ou adiciona um novo" : "adiciona seu primeiro cartão"}</label><input class="input" id="nc-name" autocomplete="off" maxlength="40" placeholder="ex.: nubank"></div>
    <button class="btn block primary" data-savecard>adicionar e usar</button></div>` });
  s.el.addEventListener("click", async e => {
    const c = e.target.closest("[data-card]"); if (c) { s.close(); onPick(c.dataset.card); return; }
    if (e.target.closest("[data-savecard]")) {
      const name = $("#nc-name", s.el).value.trim();
      if (!name) { toast("dá um nome para o cartão", true); $("#nc-name", s.el).focus(); return; }
      if (S.cards.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast("já tem um cartão com esse nome", true); return; }
      const id = uid("c"); await backend.put("cards", id, { name, createdAt: Date.now() }); s.close(); onPick(id);
    }
  });
}
const cardsSorted = () => [...S.cards].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

const bsNorm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const BS_PER = [["all", "todo o período"], ["month", "este mês"], ["past", "só o que já aconteceu"], ["future", "só o que vai acontecer"], ["year", "este ano"], ["custom", "escolher datas"]];

function bsRange() {
  const P = UI.bsP, y = NOW.getFullYear();

function openPrevDays() {
  let n = prevDiv();
  const m = openSheet({ title: "dias do mês", body: `<div class="stepper" role="group" aria-label="dias do mês"><button class="st-b" data-st="-1" aria-label="menos um dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="st-n num" aria-live="polite"></span><button class="st-b" data-st="1" aria-label="mais um dia">${I.plus}</button></div><button class="sbtn solid st-save" data-stsave>salvar</button>` });
  const draw = () => { $(".st-n", m.el).textContent = n; $('[data-st="-1"]', m.el).disabled = n <= 28; $('[data-st="1"]', m.el).disabled = n >= 31; };
  draw();
  m.el.addEventListener("click", e => {
    const b = e.target.closest("[data-st]");
    if (b && !b.disabled) { n = Math.min(31, Math.max(28, n + +b.dataset.st)); draw(); const el = $(".st-n", m.el); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    if (e.target.closest("[data-stsave]")) { saveProfile({ prevDias: n }); m.close(); }
  });
}

      <div class="sbtns">${p ? `<button class="sbtn is-danger" data-delprev>apagar</button>` : ""}<button class="sbtn solid" data-saveprev>salvar</button></div>`,

function openCardForm(id) {

/* ===== configurações ===== */

const curTheme = () => prof().theme || lsGet("ae.theme", null) || "dark";

    const th = (THEMES.find(([k]) => k === curTheme()) || THEMES[1])[1];

function openAppearance() {

  };

function openMyData() {
  openScreen({
    title: "meus dados",
    body: `<div class="slist2">${srow({ attr: "data-zerar", ico: SI.reset, main: "zerar minha conta", sub: "apaga todas as movimentações e recomeça sua conta do zero", chev: false })}
      ${srow({ attr: "data-apagar", ico: I.trash, main: "apagar minha conta", sub: "exclui permanentemente sua conta e apaga todos os seus dados no app", chev: false, cls: "danger-row" })}</div>`,
    onMount: el => el.addEventListener("click", async e => {
      if (e.target.closest("[data-zerar]")) {
        if (!(await confirmBox({ title: "zerar minha conta?", text: `${S.txs.length === 1 ? "a sua movimentação vai ser apagada" : `todas as suas ${S.txs.length} movimentações vão ser apagadas`}. cartões, previsão de diário e perfil continuam como estão.`, ok: "zerar conta" }))) return;
        await wipe(["tx"]); S.checkins = {}; backend.putCheckins({});
      }
      if (e.target.closest("[data-apagar]")) {
        if (!(await confirmBox({ title: "apagar minha conta?", text: "sua conta e todos os seus dados vão ser apagados de vez.", ok: "apagar conta" }))) return;
        if (S.mode === "supabase" && (!SB || !isOnline())) { toast("sem internet. conecta para apagar a conta", true); return; }
        while (SCREENS.length) SCREENS[SCREENS.length - 1].close();
        if (S.mode === "supabase") {
          const { error } = await SB.from(SB_TABLE).delete().eq("user_id", SB_USER.id);
          if (error) { console.warn(error); return; }
          applyData(null); lsSet(CACHE_KEY, null); await SB.auth.signOut({ scope: "local" }); return;
        }
        await wipe(["tx", "cards", "prev"]); backend.putCheckins({}); await backend.putProfile({ ...DEFAULT_PROFILE, deleted: true });
        UI.signedOut = "deleted"; render();
      }

  });
}
async function wipe(colls) {
  const K = { tx: "txs", tags: "tags", cards: "cards", prev: "prev" };
  for (const c of colls) for (const x of [...S[K[c]]]) await backend.del(c, x.id);
}

async function signOut() {
  if (!(await confirmBox({ title: "sair da conta?", text: "você pode entrar de novo quando quiser.", ok: "sair", danger: false }))) return;
  closePanel(); while (SCREENS.length) SCREENS[SCREENS.length - 1].close();
  if (backend.signOut) { await backend.signOut(); return; }
  UI.signedOut = "out"; render();
}

/* ================= login (supabase) ================= */
let AUTH = "login";
function hideAuth() { const el = $("#auth"); if (el) el.remove(); $("#app").style.display = ""; const f = $("#fab"); if (f) placeFab(); }
function showAuth(mode, opt) {
  opt = opt || {};
  if (mode === "loading") return; // a abertura (nome + logo) cobre a tela enquanto carrega
  hideSplash();
  AUTH = mode; closePanel(); while (modals.length) modals[modals.length - 1].close();
  $("#app").style.display = "none"; const fab = $("#fab"); if (fab) fab.hidden = true;
  let el = $("#auth");
  if (!el) { el = document.createElement("div"); el.id = "auth"; el.className = "auth"; document.body.appendChild(el); bindAuth(el); }
  const pw = (id, label, ac) => `<div class="field"><label for="${id}">${label}</label><div class="input-wrap"><input class="input" id="${id}" type="password" autocomplete="${ac}"><button class="eye" type="button" data-eye="${id}" aria-label="mostrar senha">${I.eye}</button></div></div>`;
  const T = {
    login: ["entrar", "entra com seu e-mail e senha.", `<div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>${pw("au-p", "senha", "current-password")}
      <button class="btn primary block" data-au="login">entrar</button>
      <div class="auth-links"><button data-go="forgot">esqueci minha senha</button>${opt.back ? `<button data-back>voltar para o app</button>` : `<button data-go="signup">criar conta</button>`}</div>`],
    signup: ["criar conta", "leva menos de um minuto.", `<div class="field"><label for="au-n">nome</label><input class="input" id="au-n" autocomplete="given-name"></div>
      <div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>${pw("au-p", "senha", "new-password")}${pw("au-p2", "confirmar senha", "new-password")}
      <button class="btn primary block" data-au="signup">criar conta</button>
      <div class="auth-links"><button data-go="login">já tenho conta</button></div>`],
    forgot: ["esqueci minha senha", "a gente envia um link para o seu e-mail para você criar uma senha nova.", `<div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>
      <button class="btn primary block" data-au="forgot">enviar link</button>
      <div class="auth-links"><button data-go="login">voltar para entrar</button></div>`],
    newpass: ["nova senha", "escolhe a senha nova da sua conta.", `${pw("au-p", "nova senha", "new-password")}${pw("au-p2", "confirmar senha", "new-password")}
      <button class="btn primary block" data-au="newpass">salvar senha</button>`],
  }[mode];
  el.innerHTML = `<form class="auth-card" novalidate>${logoSVG(64, true)}<h2>${T[0]}</h2>${T[1] ? `<p class="muted">${T[1]}</p>` : ""}${T[2]}<p class="auth-msg" id="au-msg" role="alert"></p></form>`;
  if (opt.email) { const e = $("#au-e", el); if (e) { e.value = opt.email; const p = $("#au-p", el); setTimeout(() => p && p.focus(), 60); } }
}
function bindAuth(el) {
  el.addEventListener("submit", e => { e.preventDefault(); const b = $("[data-au]", el); if (b) b.click(); });
  el.addEventListener("click", async e => {
    const eye = e.target.closest("[data-eye]");
    if (eye) { e.preventDefault(); const i = $("#" + eye.dataset.eye, el); const show = i.type === "password"; i.type = show ? "text" : "password"; eye.innerHTML = show ? I.eyeOff : I.eye; eye.setAttribute("aria-label", show ? "esconder senha" : "mostrar senha"); return; }
    const back = e.target.closest("[data-back]"); if (back) { e.preventDefault(); hideAuth(); render(); return; }
    const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); showAuth(go.dataset.go); return; }
    const b = e.target.closest("[data-au]"); if (!b) return;
    e.preventDefault();
    const msg = t => { $("#au-msg", el).textContent = t; };
    const email = ($("#au-e", el)?.value || "").trim(), pass = $("#au-p", el)?.value || "", pass2 = $("#au-p2", el)?.value || "";
    const mode = b.dataset.au;
    if (mode !== "newpass" && !/^\S+@\S+\.\S+$/.test(email)) return msg("confere o e-mail");
    if ((mode === "login" || mode === "signup" || mode === "newpass") && pass.length < 6) return msg("a senha precisa ter pelo menos 6 caracteres");
    if ((mode === "signup" || mode === "newpass") && pass !== pass2) return msg("as senhas não são iguais");
    b.disabled = true; msg("");
    try {
      if (mode === "login") { const { error } = await SB.auth.signInWithPassword({ email, password: pass }); if (error) throw error; }
      if (mode === "signup") {
        const { data, error } = await SB.auth.signUp({ email, password: pass, options: { data: { nome: ($("#au-n", el).value || "").trim() }, emailRedirectTo: location.href.split("#")[0].split("?")[0] } });
        if (error) throw error;
        if (!data.session) { showAuthKeepMsg("login", "pronto! confirma a conta pelo link que enviamos para o seu e-mail e depois entra aqui."); showMailSent(email); }
      }
      if (mode === "forgot") { const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] }); if (error) throw error; msg("se esse e-mail tiver conta, o link já está a caminho."); }
      if (mode === "newpass") { const { error } = await SB.auth.updateUser({ password: pass }); if (error) throw error; msg("senha salva! entrando…"); setTimeout(() => location.replace(location.href.split("#")[0]), 800); }
    } catch (err) {
      console.warn(err);
      const m = String(err.message || "");
      msg(/invalid login/i.test(m) ? "e-mail ou senha errados" : /already registered/i.test(m) ? "esse e-mail já tem conta. é só entrar" : /rate|seconds/i.test(m) ? "muitas tentativas. espera um pouquinho e tenta de novo" : "não deu para continuar. tenta de novo");
    } finally { const bb = $("[data-au]", el); if (bb) bb.disabled = false; }
  });
}
function showMailSent(email) {
  const old = $(".mail-ov"); if (old) old.remove();
  const ov = document.createElement("div");
  ov.className = "mail-ov";
  ov.innerHTML = `<div class="mail-box" role="dialog" aria-modal="true" aria-labelledby="mail-t">
    <div class="mail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div>
    <h2 id="mail-t">confirma seu e-mail</h2>
    <p>enviamos um link de confirmação para<span class="mail-to">${esc(email)}</span>abre ele para ativar sua conta e depois é só entrar aqui.</p>
    <p class="mail-tip">não chegou? dá uma olhada na caixa de spam ou lixo eletrônico.</p>
    <button class="btn primary block" type="button" data-mail-ok>entendi</button>
  </div>`;
  document.body.appendChild(ov);
  const close = () => { if (ov.classList.contains("out")) return; ov.classList.add("out"); setTimeout(() => { ov.remove(); const e = $("#au-e"); if (e) e.focus(); }, 200); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  $("[data-mail-ok]", ov).onclick = close;
  setTimeout(() => $("[data-mail-ok]", ov)?.focus(), 60);
  const e = $("#au-e"); if (e) e.value = email;
}
function showAuthKeepMsg(mode, text) { showAuth(mode); const m = $("#au-msg"); if (m) m.textContent = text; }
function renderSignedOut() {
  $("#app").style.display = "none";
  let el = $("#signed");
  if (!el) { el = document.createElement("div"); el.id = "signed"; el.className = "full-screen"; el.style.background = "var(--bg)"; document.body.appendChild(el); }
  const del = UI.signedOut === "deleted";
  el.innerHTML = `${logoSVG(64, true)}
    <h2 style="margin:0;font-size:24px">${del ? "sua conta foi apagada" : "você saiu da sua conta"}</h2>
    <p class="muted" style="margin:0;max-width:34ch">${del ? "tudo foi apagado. se quiser, dá para começar do zero agora." : "até logo! seus dados continuam salvos."}</p>
    <button class="btn primary" id="relog">${del ? "começar do zero" : "entrar de novo"}</button>`;
  $("#relog").onclick = () => {
    if (del) backend.putProfile({ ...DEFAULT_PROFILE });
    UI.signedOut = false; el.remove(); $("#app").style.display = ""; UI.tab = "saldos"; $("#view").dataset.tab = ""; render();
  };
}

/* ================= celular: zoom bloqueado em tudo ================= */
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
  const stop = e => e.preventDefault();
  ["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, stop, { passive: false }));
  document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  let lastTap = 0;
  document.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTap < 350 && !e.target.closest("button,a,input,textarea,select,label,[role=button]")) e.preventDefault(); lastTap = t; }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
}

/* ================= segurar o dedo = tocar ================= */
(() => {
  let st = null;
  const CLICKABLE = "button,a[href],label,[role=button],[data-act],.frow,.sitem,.lrow,.row,.pop-item";
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { st = null; return; }
    const el = e.target.closest(CLICKABLE);
    st = el && !e.target.closest("input,textarea,.m-cell[data-t]") ? { el, x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), moved: false } : null;
  }, { passive: true });
  document.addEventListener("touchmove", e => { if (st && Math.hypot(e.touches[0].clientX - st.x, e.touches[0].clientY - st.y) > 10) st.moved = true; }, { passive: true });
  document.addEventListener("touchend", e => {
    const s = st; st = null;
    if (!s || s.moved || Date.now() - s.t < 450) return;
    if (!s.el.isConnected || s.el.disabled) return;
    e.preventDefault(); // toque longo vira um toque normal, sem menu nem seleção
    s.el.click();
  }, { passive: false });
  document.addEventListener("contextmenu", e => { if (!e.target.closest("input,textarea")) e.preventDefault(); });
  document.addEventListener("selectstart", e => { if (!e.target.closest || !e.target.closest("input,textarea")) e.preventDefault(); });
})();

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !(window.claude && window.claude.use)) {

document.addEventListener("focusin", e => {
  const t = e.target;
  if (t && t.tagName === "INPUT" && !t.hasAttribute("autocomplete") && /^(text|number|search|tel|)$/.test(t.getAttribute("type") || "")) t.setAttribute("autocomplete", "off");
}, true);

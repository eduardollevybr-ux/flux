<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FLUX · conectar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{--screen:#000;--surface2:#141414;--text:#EDEDEE;--muted:#9C9AA6;--line:rgba(237,237,238,.11);--accent:#8A3FD9;--acc2:#B98AF0;--danger:#EF4B4F;--font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--screen:#fff;--surface2:#F3F3F5;--text:#1D1F23;--muted:#686D76;--line:rgba(29,31,35,.09);--accent:#820AD1;--acc2:#820AD1;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--screen);color:var(--text);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
.wrap{min-height:100dvh;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(140deg,#9B4FF0,#5E1FB0);display:grid;place-items:center;--logo-a:#fff;--logo-b:#fff;margin-bottom:28px}
.logo svg{width:40px;height:40px}
h1{margin:0 0 6px;font-size:26px;line-height:1.2;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:16px}
.who{color:var(--text);font-weight:600}
.list{margin:28px 0 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.list li:last-child{border-bottom:0}
.ic{width:24px;height:24px;flex:none;color:var(--acc2)}
.ic .L{fill:currentColor;opacity:.42}.ic .S{fill:currentColor}
.ic .Sk{stroke:currentColor}.ic .Lk{stroke:currentColor;opacity:.42}
.acc{margin-top:22px;color:var(--muted);font-size:14px}
.grow{flex:1;min-height:24px}
.btns{display:flex;flex-direction:column;gap:6px;margin-top:28px}
.btn{height:54px;border:0;border-radius:16px;font:700 16px var(--font);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--text);color:var(--screen)}
.btn.plain{background:none;color:var(--muted);font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.field label{font-size:14px;color:var(--muted)}
.field input{border:0;background:none;color:var(--text);font:400 17px var(--font);outline:none;padding:2px 0}
.field input::placeholder{color:var(--muted);opacity:.6}
.err{min-height:22px;margin-top:10px;color:var(--danger);font-size:14px}
.spin{width:22px;height:22px;border-radius:99px;border:2.5px solid var(--line);border-top-color:var(--text);animation:sp .8s linear infinite;margin:40px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

  <!-- carregando -->
  <section id="v-load"><div class="spin" aria-label="carregando"></div></section>

  <!-- entrar (quando ainda não está logado neste navegador) -->
  <section id="v-login" class="hide fade">
    <h1>entre no FLUX</h1>
    <p class="sub">para conectar <span class="who" data-cli>o assistente</span> à sua conta.</p>
    <form id="f-login" autocomplete="on" style="margin-top:22px">
      <div class="field"><label for="em">e-mail</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div class="err" id="e-login" role="alert"></div>
      <div class="btns"><button class="btn solid" type="submit" id="b-login">entrar</button></div>
    </form>
  </section>

  <!-- autorizar -->
  <section id="v-ok" class="hide fade" style="display:flex;flex-direction:column;flex:1">
    <h1><span data-cli>o assistente</span> quer acessar seu FLUX</h1>
    <p class="sub">ao autorizar, ele vai poder:</p>
    <ul class="list">
      <li><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="L" d="M1.8 12C4 7.6 7.7 5 12 5s8 2.6 10.2 7C20 16.4 16.3 19 12 19S4 16.4 1.8 12Z"/><path class="S" d="M8.6 12A3.4 3.4 0 1 0 15.4 12A3.4 3.4 0 1 0 8.6 12Z"/></svg></span>ver seus lançamentos e saldos</li>
      <li><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="L" d="M2.5 12A9.5 9.5 0 1 0 21.5 12A9.5 9.5 0 1 0 2.5 12Z"/><path class="Sk" d="M12 7.8v8.4M7.8 12h8.4" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg></span>lançar gastos e recebimentos</li>
    </ul>
    <p class="acc">conta: <span class="who" id="conta"></span></p>
    <div class="grow"></div>
    <div class="err" id="e-ok" role="alert"></div>
    <div class="btns">
      <button class="btn solid" id="b-sim">autorizar</button>
      <button class="btn plain" id="b-nao">agora não</button>
    </div>
  </section>

  <!-- fim ou erro -->
  <section id="v-msg" class="hide fade">
    <h1 id="m-t"></h1>
    <p class="sub" id="m-s"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
/* tela de autorizar do FLUX: o assistente de IA manda a pessoa para cá, ela confirma e volta para o assistente.
   usa a mesma sessão do app (mesma chave de login guardada no navegador). */
const URL_SB = "https://ccxiuaqirickchmrowrz.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjeGl1YXFpcmlja2NobXJvd3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDg2NTQsImV4cCI6MjEwMTY4NDY1NH0.TiInMdno4_yvWK-c8mg6DY7IymPaJKrtN1CwS-8dm8U";
const $ = s => document.querySelector(s);
const show = id => { ["v-load", "v-login", "v-ok", "v-msg"].forEach(v => $("#" + v).classList.toggle("hide", v !== id)); };
const msg = (t, s) => { $("#m-t").textContent = t; $("#m-s").textContent = s; show("v-msg"); };
const authId = new URLSearchParams(location.search).get("authorization_id");
let SB;
try { SB = supabase.createClient(URL_SB, ANON, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "flux-auth" } }); }
catch { SB = null; }

async function carregar() {
  if (!SB) return msg("não deu para abrir agora", "verifique sua internet e tente de novo pelo assistente.");
  if (!authId) return msg("esse link não vale mais", "comece de novo pelo assistente.");
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { show("v-login"); setTimeout(() => $("#em").focus(), 50); return; }
  const { data, error } = await SB.auth.oauth.getAuthorizationDetails(authId);
  if (error || !data) return msg("esse link não vale mais", "comece de novo pelo assistente.");
  if (data.redirect_url && !data.authorization_id) { location.replace(data.redirect_url); return; } // já tinha autorizado antes
  const nome = (data.client && data.client.name) || "o assistente";
  document.querySelectorAll("[data-cli]").forEach(e => { e.textContent = nome; });
  $("#conta").textContent = (data.user && data.user.email) || session.user.email || "";
  show("v-ok");
}

$("#f-login").addEventListener("submit", async e => {
  e.preventDefault();
  const b = $("#b-login"); b.disabled = true; $("#e-login").textContent = "";
  const { error } = await SB.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  b.disabled = false;
  if (error) { $("#e-login").textContent = /invalid/i.test(error.message) ? "e-mail ou senha incorretos." : "não deu para entrar agora. tente de novo."; return; }
  show("v-load"); carregar();
});

async function decidir(aprovar) {
  const b1 = $("#b-sim"), b2 = $("#b-nao"); b1.disabled = b2.disabled = true; $("#e-ok").textContent = "";
  const f = aprovar ? SB.auth.oauth.approveAuthorization : SB.auth.oauth.denyAuthorization;
  const { data, error } = await f.call(SB.auth.oauth, authId, { skipBrowserRedirect: true });
  if (error || !data || !data.redirect_url) { b1.disabled = b2.disabled = false; $("#e-ok").textContent = "não deu para concluir agora. tente de novo."; return; }
  if (aprovar) msg("pronto, conectado", "voltando para o assistente.");
  else msg("tudo bem, nada foi conectado", "voltando para o assistente.");
  setTimeout(() => location.replace(data.redirect_url), 600);
}
$("#b-sim").addEventListener("click", () => decidir(true));
$("#b-nao").addEventListener("click", () => decidir(false));
carregar();
</script>
</body>
